"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Placeholder guard: production deploys fail while any {{placeholder}} is left in public/.
# Deploy previews and branch deploys still build. To go live, fill the placeholders; do not delete this check.
[context.production]
  command = "if grep -rIl '{{' public/; then echo 'Unfilled {{placeholders}} found in the files above. Fill them before deploying to production.'; exit 1; fi"

# Common legal URLs that used to return 404
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms-of-use/"
  status = 301
